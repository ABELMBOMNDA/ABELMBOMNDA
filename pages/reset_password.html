<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password – NeuralCards</title>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body>
  <div class="auth-container">
    <h2>Reset Password</h2>

    <div id="step-request">
      <p style="color:var(--text-light);margin-bottom:18px;font-size:14px;">
        Enter your registered email and we'll send you a reset link.
      </p>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required/>
      </div>
      <div id="error-msg"   class="error-msg   hidden"></div>
      <div id="success-msg" class="success-msg hidden"></div>
      <button id="sendResetBtn" class="btn btn-primary btn-full">Send Reset Link</button>
    </div>

    <p class="auth-link"><a href="login.html">Back to Login</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
